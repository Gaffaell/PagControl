[project]
name = "frontend"
version = "0.1.0"
description = "Interface Streamlit para o Sistema de Cobrança PagControl"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
