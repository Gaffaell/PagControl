[project]
name = "backend"
version = "0.1.0"
description = "API FastAPI para o Sistema de Cobrança PagControl"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
backend = "backend.cli:resumo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
