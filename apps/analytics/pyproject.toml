[project]
name = "analytics"
version = "0.1.0"
description = "Módulo de Big Data do PagControl: dados sintéticos, PDD e curva de vintage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faker>=30.0.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
